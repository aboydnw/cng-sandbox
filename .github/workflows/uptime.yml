name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

permissions: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check site health
        id: health
        run: |
          HTTP_STATUS=000
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 20 \
              "https://storytelling.developmentseed.org/api/health") || HTTP_STATUS=000
            [ "$HTTP_STATUS" = "200" ] && break
            echo "Health check attempt $attempt/3 returned HTTP $HTTP_STATUS"
            [ "$attempt" = "3" ] || sleep 10
          done
          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Site is healthy (HTTP $HTTP_STATUS)"
          else
            echo "Site is DOWN (HTTP $HTTP_STATUS)"
          fi

      - name: Open issue if down
        if: steps.health.outputs.status != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_STATUS: ${{ steps.health.outputs.status }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "incident" \
            --state open \
            --search "Site health check failing" \
            --json number \
            --jq '.[0].number // empty')

          BODY="The uptime monitor detected that storytelling.developmentseed.org is not responding."
          BODY="${BODY}\n\n- **HTTP status**: ${HTTP_STATUS}"
          BODY="${BODY}\n- **Endpoint**: https://storytelling.developmentseed.org/api/health"
          BODY="${BODY}\n- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')"
          BODY="${BODY}\n\n## Troubleshooting"
          BODY="${BODY}\n\nSSH into the VM and check:"
          BODY="${BODY}\n\n\`\`\`bash"
          BODY="${BODY}\ndocker compose --profile prod ps"
          BODY="${BODY}\ndocker compose --profile prod logs --tail 50"
          BODY="${BODY}\n\`\`\`"
          BODY="${BODY}\n\nIf services are down, pull the published images and restart:"
          BODY="${BODY}\n\n\`\`\`bash"
          BODY="${BODY}\ndocker compose --profile prod pull"
          BODY="${BODY}\ndocker compose --profile prod up -d"
          BODY="${BODY}\n\`\`\`"

          if [ -n "$EXISTING" ]; then
            echo "Incident #$EXISTING remains open; no duplicate notification needed."
          else
            printf '%b' "$BODY" | gh issue create \
              --repo "${{ github.repository }}" \
              --title "Site health check failing (HTTP ${HTTP_STATUS})" \
              --label "incident" \
              --body-file -
          fi

      - name: Close issue if recovered
        if: steps.health.outputs.status == '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "incident" \
            --state open \
            --search "Site health check failing" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --repo "${{ github.repository }}" \
              --body "Recovered as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$EXISTING" \
              --repo "${{ github.repository }}"
          fi
